version: '3.8' 
services: 
  satosi: 
    build: . 
    ports: 
      - "8081:8080" 
    networks: 
      - blockchain-net 
    volumes:
      - data/satosi:/
  bob: 
    build: . 
    ports: 
      - "8082:8080" 
    networks: 
      - blockchain-net
    volumes:
      - data/bob:/
  alice: 
    build: . 
    ports: 
      - "8083:8080" 
    networks: 
      - blockchain-net 
    volumes:
      - data/alice:/

networks: 
  blockchain-net: 
    driver: bridge