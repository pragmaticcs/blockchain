services: 
  satoshi: 
    build: 
      context: .
      args:
        - DATA_DIR=data/satoshi
    ports: 
      - "8081:8080" 
    networks: 
      - blockchain-net 
  alice: 
    build: 
      context: .
      args:
        - DATA_DIR=data/alice
    ports: 
      - "8082:8080" 
    networks: 
      - blockchain-net 
  bob: 
    build: 
      context: .
      args:
        - DATA_DIR=data/bob
    ports: 
      - "8083:8080" 
    networks: 
      - blockchain-net

networks: 
  blockchain-net: 
    driver: bridge